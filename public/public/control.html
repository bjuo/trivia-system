<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שליטה במשחק</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 24px; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .code { font-size: 20px; color: #aaa; margin-bottom: 8px; }
  .phase-label { font-size: 22px; color: #7f77dd; margin-bottom: 20px; }
  .question-preview { font-size: 28px; margin: 20px 0; max-width: 700px; line-height: 1.5; }
  .answer-preview { font-size: 22px; color: #5dcaa5; margin-top: 10px; }
  .big-button { font-size: 32px; padding: 30px 60px; background: #534ab7; color: white; border: none; border-radius: 16px; cursor: pointer; margin-top: 30px; }
  .big-button:hover { background: #3c3489; }
  .hint { color: #888; margin-top: 16px; font-size: 14px; }
  .stats { margin-top: 30px; color: #aaa; font-size: 16px; }
  .timer-remaining { font-size: 40px; color: #ef9f27; margin-top: 10px; }
</style>
</head>
<body>
<div class="code" id="codeLabel"></div>
<div class="phase-label" id="phaseLabel">טוען...</div>
<div class="question-preview" id="questionPreview"></div>
<div class="answer-preview" id="answerPreview"></div>
<div class="timer-remaining" id="timerRemaining"></div>

<button class="big-button" id="advanceBtn" onclick="advance()">התקדם ▶</button>
<div class="hint">אפשר גם ללחוץ על מקש רווח, חץ ימינה, או Page Down (שלט מצגות)</div>

<div class="stats" id="stats"></div>

<script>
const params = new URLSearchParams(location.search);
const code = params.get('code');
document.getElementById('codeLabel').textContent = 'קוד משחק: ' + code;

const phaseLabels = {
  idle: 'לחץ התקדם כדי להתחיל',
  question: 'מציג שאלה - לחץ כדי להתחיל שעון',
  timer: 'שעון פועל - לחץ כדי לחשוף תשובה',
  reveal: 'תשובה נחשפת - לחץ לשאלה הבאה',
};

async function refresh() {
  const res = await fetch('/api/control/' + code);
  if (!res.ok) return;
  const g = await res.json();
  render(g);
}

function render(g) {
  document.getElementById('phaseLabel').textContent =
    (g.status === 'finished') ? 'המשחק הסתיים' : (phaseLabels[g.phase] || g.phase);
  document.getElementById('questionPreview').textContent =
    g.questionText ? ('שאלה ' + g.questionNumber + '/' + g.totalQuestions + ': ' + g.questionText) : '';
  document.getElementById('answerPreview').textContent =
    g.correctAnswerText ? ('תשובה נכונה: ' + g.correctAnswerText) : '';

  if (g.phase === 'timer' && g.timerEndsAt) {
    const remaining = Math.max(0, Math.ceil((g.timerEndsAt - Date.now()) / 1000));
    document.getElementById('timerRemaining').textContent = remaining + ' שניות';
  } else {
    document.getElementById('timerRemaining').textContent = '';
  }

  const playerCount = g.players.length;
  document.getElementById('stats').textContent = playerCount + ' משתתפים רשומים';
}

async function advance() {
  const res = await fetch('/api/control/' + code + '/advance', { method: 'POST' });
  const g = await res.json();
  render(g);
}

document.addEventListener('keydown', (e) => {
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) {
    e.preventDefault();
    advance();
  }
});

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
